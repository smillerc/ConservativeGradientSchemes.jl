name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia: ['~1.13', '1']
    env:
      POCL_CACHE_DIR: ${{ runner.temp }}/pocl
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - run: >-
          julia --startup-file=no --project -e
          'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args=["--check-bounds=auto"])'
